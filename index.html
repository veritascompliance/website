
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veritas Compliance Solutions</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
color:#333;
}

header{
background:linear-gradient(135deg,#0b3d91,#1565c0);
color:#fff;
padding:60px 20px;
text-align:center;
}

header h1{
font-size:36px;
margin-bottom:10px;
}

header p{
font-size:18px;
margin-bottom:25px;
}

.btn{
display:inline-block;
background:#25D366;
color:white;
padding:14px 30px;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}

section{
max-width:1100px;
margin:auto;
padding:50px 20px;
}

h2{
text-align:center;
color:#0b3d91;
margin-bottom:30px;
}

.services{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#fff;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
}

footer{
background:#0b3d91;
color:#fff;
text-align:center;
padding:20px;
margin-top:40px;
}
</style>
